[project]
name = "chat-agent-music-emporium"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.8",
    "langgraph>=1.2.19",
    "langgraph-cli>=0.4.40",
]

[project.scripts]
chat-agent-music-emporium = "chat_agent_music_emporium:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
preview = true
select = ['I','F','E','W','PL','PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

